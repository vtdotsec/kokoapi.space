<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>kokoapi.space traffic</title>
  <link rel="stylesheet" href="/analytics/dashboard.css">
</head>
<body>
  <p class="muted">PRIVATE DASHBOARD · SELF-HOSTED</p>
  <h1>Traffic, without visitor profiles.</h1>
  <p>Aggregate pageviews only. This dashboard does not identify or estimate unique people.</p>
  <div class="toolbar"><label for="days">Range</label><select id="days"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="365">12 months</option></select><button id="refresh">Refresh</button></div>
  <p id="notice" role="status"></p>
  <div id="cards" class="cards"></div>
  <h2>By site and tool</h2><div class="scroll"><table><thead><tr><th>Site</th><th>Path</th><th>Source</th><th>Pageviews</th></tr></thead><tbody id="rows"></tbody></table></div>
  <script src="/analytics/dashboard.js" defer></script>
</body>
</html>
