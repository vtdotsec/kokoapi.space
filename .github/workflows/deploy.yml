# Deploys kokoapi.space on every push to main.
# 1) CI validates that the Astro site builds cleanly.
# 2) The production VM is notified over SSH to pull and rebuild the Docker
#    Compose services (static web nginx, Secret Sender, Repasses and analytics).

name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build:
    name: Build
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Validate build
        run: npm run build

      - name: Local utility unit checks
        run: node --test scripts/utility-core.test.mjs

      - name: Tools privacy checks
        run: node scripts/check-tools-privacy.mjs

      - name: Type/content check
        run: npm run check

      - name: Build first-party analytics collector
        run: docker build -t kokoapi-analytics-check ./apps/analytics

      - name: Install Repasses dependencies
        working-directory: apps/repasses
        run: npm ci

      - name: Build Repasses
        working-directory: apps/repasses
        run: npm run build

      - name: Build Santa Bruma
        working-directory: apps/game
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      # Requires the following repository secrets: DEPLOY_HOST, DEPLOY_USER,
      # DEPLOY_SSH_KEY, DEPLOY_PORT (optional), DEPLOY_PATH.
      - name: Check deploy secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GAME_PASSWORD: ${{ secrets.GAME_ACCESS_PASSWORD }}
        run: |
          test -n "$HOST" || { echo "Missing secret: DEPLOY_HOST"; exit 1; }
          test -n "$USER" || { echo "Missing secret: DEPLOY_USER"; exit 1; }
          test -n "$KEY" || { echo "Missing secret: DEPLOY_SSH_KEY"; exit 1; }
          test -n "$GAME_PASSWORD" || { echo "Missing secret: GAME_ACCESS_PASSWORD"; exit 1; }
          echo "Deploy secrets are configured."

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: GAME_ACCESS_PASSWORD
          # Fail fast: a dirty or diverged checkout must stop the deploy
          # instead of silently rebuilding and serving stale files.
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git status --porcelain
            git fetch origin main
            git pull --ff-only origin main
            git rev-parse --short HEAD
            umask 077
            touch .env
            sed -i '/^GAME_ACCESS_PASSWORD=/d' .env
            printf 'GAME_ACCESS_PASSWORD=%s\n' "$GAME_ACCESS_PASSWORD" >> .env
            chmod 600 .env
            docker compose --project-name kokoapispace down --remove-orphans
            docker builder prune -f || true
            docker compose --project-name kokoapispace up -d --build --remove-orphans
            docker image prune -f
            docker exec -u 0 stoat-caddy-1 sh -c 'grep -q "game.kokoapi.space" /etc/caddy/Caddyfile || printf "\\ngame.kokoapi.space {\\n reverse_proxy 127.0.0.1:8080\\n}\\n" >> /etc/caddy/Caddyfile'
            docker exec stoat-caddy-1 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker exec stoat-caddy-1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            for attempt in $(seq 1 30); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' kokoapi-game 2>/dev/null || true)
              [ "$STATUS" = healthy ] && break
              sleep 2
            done
            test "$STATUS" = healthy
            test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: game.kokoapi.space' http://127.0.0.1:8080/)" = 401
            test "$(curl -sS -u "player:$GAME_ACCESS_PASSWORD" -o /dev/null -w '%{http_code}' -H 'Host: game.kokoapi.space' http://127.0.0.1:8080/)" = 200
        env:
          GAME_ACCESS_PASSWORD: ${{ secrets.GAME_ACCESS_PASSWORD }}
