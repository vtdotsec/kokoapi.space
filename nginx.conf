# Static server config for the Astro build output.
# Terminate TLS at a reverse proxy in front of this container.

server {
    listen 80;
    server_name kokoapi.space www.kokoapi.space;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # --- Security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # --- Compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Static assets with content-hash names: cache forever -------------
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /og.svg {
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Pages ------------------------------------------------------------
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # --- Ephemeral sharing app (proxied to the Node "kokoapi-tools-secret" service) --
    # The web container is the only published entry point; /secret/ is routed
    # to the Node service over the compose network.
    location = /secret {
        return 301 /secret/;
    }

    location /secret/ {
        # Resolve the upstream per request so restarts do not break nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $secret_upstream http://kokoapi-tools-secret:8787;
        proxy_pass $secret_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # UI enforces 10 MB plaintext; base64 upload adds ~33% plus JSON.
        client_max_body_size 16m;
    }

    # --- Static app: PDF toolkit (/pdf/) ---------------------------------
    # Pure static assets shipped with the site build (public/pdf -> dist/pdf).
    location /pdf/ {
        try_files $uri $uri/index.html =404;
    }

    # --- Static app: Image toolkit (/image/) --------------------------------
    # Pure static assets shipped with the site build (public/image -> dist/image).
    location /image/ {
        try_files $uri $uri/index.html =404;
    }

    # --- Static app: File converter (/convert/) -----------------------------
    # Pure static assets shipped with the site build (public/convert -> dist/convert).
    location /convert/ {
        try_files $uri $uri/index.html =404;
    }

    # --- Legacy /qrcode/ route: QR generation now lives in the image tools ---
    location ^~ /qrcode {
        return 301 /image/qrcode/;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
