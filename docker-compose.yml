services:
  kokoapi-tools-web:
    build: .
    container_name: kokoapi-tools-web

    ports:
      - "8080:80"

    read_only: true

    depends_on:
      - kokoapi-tools-secret
      - kokoapi-repasses
      - kokoapi-analytics

    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /var/log/nginx:uid=101,gid=101,mode=0755

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Repasses is a self-contained static app, served internally by the web nginx
  # after routing the repasses.kokoapi.space host header.
  kokoapi-repasses:
    build: ./apps/repasses
    container_name: kokoapi-repasses

    expose:
      - "80"

    read_only: true

    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /var/log/nginx:uid=101,gid=101,mode=0755
      - /tmp

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Private single-player Santa Bruma game. Save data lives in its own SQLite volume.
  kokoapi-game:
    build: ./apps/game
    container_name: kokoapi-game

    expose:
      - "8789"

    environment:
      - DATA_DIR=/data
      - GAME_ACCESS_PASSWORD=${GAME_ACCESS_PASSWORD:?Set GAME_ACCESS_PASSWORD in the deployment environment}

    volumes:
      - game-data:/data

    mem_limit: 384m

    read_only: true

    tmpfs:
      - /tmp

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 8s

  # First-party, opt-in traffic metrics. The service stores only daily aggregates
  # and short-lived hashes; its SQLite volume is separate from app data.
  kokoapi-analytics:
    build: ./apps/analytics
    container_name: kokoapi-analytics

    expose:
      - "8788"

    volumes:
      - analytics-data:/data

    mem_limit: 192m

    read_only: true

    tmpfs:
      - /tmp

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/analytics/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Ephemeral sharing app (/secret/). Plain Node, zero deps; encrypted blobs on disk.
  kokoapi-tools-secret:
    build: ./secret
    container_name: kokoapi-tools-secret

    environment:
      - DATA_DIR=/data

    volumes:
      - secret-data:/data

    mem_limit: 128m

    read_only: true

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/secret/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  game-data:
  secret-data:
  analytics-data:
