<section class="tool" id="tool-md2html">
          <div class="tool-head">
            <h3>Markdown → HTML</h3>
            <p class="size-note">
              Paste Markdown, preview it as HTML, then download a standalone page.
            </p>
          </div>
          <textarea
            id="cv-md2html-src"
            class="ta mono"
            rows="10"
            spellcheck="false"
            placeholder="# Hello&#10;&#10;Write **Markdown** here and press “Convert &amp; preview”."
          ></textarea>
          <div class="form-row">
            <button type="button" id="cv-md2html-run" class="btn" disabled>Convert &amp; preview</button>
            <button type="button" id="cv-md2html-dl" class="btn btn-ghost" disabled>Download .html</button>
            <span id="cv-md2html-status" class="status" role="status"></span>
          </div>
          <div id="cv-md2html-out" class="md-preview" hidden></div>
          <details id="cv-md2html-raw" class="raw-details" hidden>
            <summary>Show HTML</summary>
            <pre class="raw" id="cv-md2html-raw-pre"></pre>
          </details>
        </section>
