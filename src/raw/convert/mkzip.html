<section class="tool" id="tool-mkzip">
          <div class="tool-head">
            <h3>Create archive</h3>
            <p class="size-note">
              Pack files into a ZIP or TAR archive, or gzip a single file.
            </p>
          </div>
          <label class="file-drop" for="cv-mkzip-files">
            <input type="file" id="cv-mkzip-files" multiple />
            <span>Choose files to pack (GZIP takes exactly one file)</span>
          </label>
          <p class="size-note" id="cv-mkzip-files-note" hidden></p>
          <ul id="cv-mkzip-list" class="file-list" hidden></ul>
          <fieldset class="options">
            <legend>Format</legend>
            <div class="opts">
              <span class="opt-label">Container</span>
              <select class="select" id="cv-mkzip-mode">
                <option value="zip">ZIP</option>
                <option value="tar">TAR (ustar)</option>
                <option value="gzip">GZIP (single file)</option>
              </select>
            </div>
          </fieldset>
          <p class="size-note">
            TAR does not compress, it only bundles. GZIP needs exactly one selected file
            and names the result <span class="mono">name.gz</span>.
          </p>
          <div class="form-row">
            <button type="button" id="cv-mkzip-run" class="btn" disabled>Create archive</button>
            <span id="cv-mkzip-status" class="status" role="status"></span>
          </div>
        </section>
