<section class="tool" id="tool-pdf2txt">
          <div class="tool-head">
            <h3>PDF → TXT</h3>
            <p class="size-note">Extract the selectable text layer of a PDF.</p>
          </div>
          <label class="file-drop" for="cv-pdf2txt-file">
            <input type="file" id="cv-pdf2txt-file" accept="application/pdf" />
            <span>Choose a PDF to extract text from</span>
          </label>
          <p class="size-note" id="cv-pdf2txt-info" hidden></p>
          <div class="form-row">
            <button type="button" id="cv-pdf2txt-copy" class="btn btn-ghost" disabled>Copy</button>
            <button type="button" id="cv-pdf2txt-dl" class="btn" disabled>Download .txt</button>
            <span id="cv-pdf2txt-status" class="status" role="status"></span>
          </div>
          <textarea
            id="cv-pdf2txt-out"
            class="ta mono"
            rows="14"
            readonly
            spellcheck="false"
            placeholder="Extracted text appears here."
          ></textarea>
        </section>
