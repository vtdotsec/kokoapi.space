<section class="tool" id="tool-xml2json">
          <div class="tool-head">
            <h3>XML → JSON</h3>
            <p class="size-note">
              One direction: elements become { tag, attrs?, children/text }. Text inside
              mixed content is kept as { tag: “#text” } nodes; CDATA is treated as text.
            </p>
          </div>
          <div class="duo">
            <div class="pane">
              <label class="pane-label" for="cv-xml2json-in">Input</label>
              <textarea
                id="cv-xml2json-in"
                class="ta mono"
                rows="10"
                spellcheck="false"
                placeholder="&lt;book id=&quot;1&quot;&gt;&#10;  &lt;title&gt;Notes&lt;/title&gt;&#10;  &lt;tag&gt;a&lt;/tag&gt;&#10;  &lt;tag&gt;b&lt;/tag&gt;&#10;&lt;/book&gt;"
              ></textarea>
            </div>
            <div class="pane">
              <label class="pane-label" for="cv-xml2json-out">Output</label>
              <textarea
                id="cv-xml2json-out"
                class="ta mono"
                rows="10"
                readonly
                spellcheck="false"
                placeholder="Converted output appears here."
              ></textarea>
            </div>
          </div>
          <div class="form-row">
            <button type="button" id="cv-xml2json-run" class="btn" disabled>Convert</button>
            <button type="button" id="cv-xml2json-dl" class="btn btn-ghost" disabled>Download .json</button>
            <span id="cv-xml2json-status" class="status" role="status"></span>
          </div>
        </section>
