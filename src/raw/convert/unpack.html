<section class="tool" id="tool-unpack">
          <div class="tool-head">
            <h3>Extract archive</h3>
            <p class="size-note">
              Open a ZIP, TAR or GZIP file. The format is detected from the file’s magic
              bytes; a .tar.gz (or .tgz) is unpacked as a TAR.
            </p>
          </div>
          <label class="file-drop" for="cv-unpack-file">
            <input type="file" id="cv-unpack-file" accept=".zip,.tar,.tgz,.gz,application/zip,application/x-tar,application/gzip" />
            <span>Choose a ZIP, TAR or GZIP file</span>
          </label>
          <p class="size-note" id="cv-unpack-info" hidden></p>
          <div class="form-row">
            <button type="button" id="cv-unpack-all" class="btn" disabled hidden>Download all as ZIP</button>
            <span id="cv-unpack-status" class="status" role="status"></span>
          </div>
          <ul id="cv-unpack-list" class="file-list" hidden></ul>
        </section>
