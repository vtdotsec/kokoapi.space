<section id="tool-compress" data-tool-panel hidden>
        <label class="file-drop" for="compress-file">
          <input type="file" id="compress-file" accept="application/pdf" />
          <span>Choose a PDF to compress</span>
        </label>
        <p class="size-note" id="compress-info"></p>
        <p class="note" id="compress-note" hidden>
          Pages are re-rendered as JPEG images inside a new PDF. Text becomes non-selectable;
          this works best for scans and image-heavy documents.
        </p>

        <fieldset class="options">
          <legend>Compression</legend>
          <div class="option">
            <label class="range-row">
              <span>Quality</span>
              <input type="range" id="compress-quality" min="10" max="90" value="50" />
              <output for="compress-quality">50</output>
            </label>
          </div>
          <div class="option">
            <label class="radio">
              <span>Resolution</span>
            </label>
            <select class="select" id="compress-scale">
              <option value="1">Screen (1×)</option>
              <option value="1.5">High (1.5×)</option>
              <option value="2">Print (2×)</option>
            </select>
          </div>
        </fieldset>
        <div class="form-row">
          <button type="button" id="compress-run" class="btn" disabled>Compress and download</button>
          <span id="compress-status" class="status" role="status"></span>
        </div>
      </section>
