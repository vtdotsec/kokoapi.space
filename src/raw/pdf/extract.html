<section id="tool-extract" data-tool-panel hidden>
        <label class="file-drop" for="extract-file">
          <input type="file" id="extract-file" accept="application/pdf" />
          <span>Choose one PDF to extract text from</span>
        </label>
        <p class="size-note" id="extract-info" hidden></p>

        <div class="form-row">
          <button type="button" id="extract-copy" class="btn ghost" disabled>Copy text</button>
          <button type="button" id="extract-txt" class="btn" disabled>Download .txt</button>
          <span id="extract-status" class="status" role="status"></span>
        </div>
        <textarea
          id="extract-output"
          class="text-pane"
          rows="12"
          readonly
          spellcheck="false"
          placeholder="Extracted text appears here."
        ></textarea>
      </section>
