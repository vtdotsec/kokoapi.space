<section id="tool-reorder" data-tool-panel hidden>
        <label class="file-drop" for="reorder-file">
          <input type="file" id="reorder-file" accept="application/pdf" />
          <span>Choose one PDF, then drag pages into the order you want</span>
        </label>
        <div class="form-row org-bar" id="reorder-bar" hidden>
          <button type="button" id="reorder-run" class="btn" disabled>Download PDF in this order</button>
          <span id="reorder-status" class="status" role="status"></span>
          <span class="muted" id="reorder-count"></span>
        </div>
        <div id="reorder-thumbs" class="thumbs" hidden></div>
        <p class="size-note" id="reorder-help" hidden>
          Drag a page card to change the order. The downloaded PDF follows the order shown.
        </p>
      </section>
