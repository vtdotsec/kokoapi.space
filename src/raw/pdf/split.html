<section id="tool-split" data-tool-panel hidden>
        <label class="file-drop" for="split-file">
          <input type="file" id="split-file" accept="application/pdf" />
          <span>Choose one PDF to split</span>
        </label>
        <p class="size-note" id="split-info"></p>

        <fieldset class="options">
          <legend>Output</legend>
          <div class="option">
            <label class="radio">
              <input type="radio" name="split-mode" value="range" checked />
              <span>Selected pages as one PDF</span>
            </label>
            <input
              type="text"
              id="split-range"
              class="text-input range-input"
              spellcheck="false"
              placeholder="Pages, e.g. 1, 3-5"
            />
          </div>
          <label class="radio">
            <input type="radio" name="split-mode" value="pages" />
            <span>Every page as a separate file (downloads a ZIP)</span>
          </label>
        </fieldset>

        <div class="form-row">
          <button type="button" id="split-run" class="btn" disabled>Split and download</button>
          <span id="split-status" class="status" role="status"></span>
        </div>
      </section>
