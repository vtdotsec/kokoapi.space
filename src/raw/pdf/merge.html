<section id="tool-merge" data-tool-panel>
        <label class="file-drop" for="merge-files">
          <input type="file" id="merge-files" accept="application/pdf" multiple />
          <span>Choose PDF files to merge (in any order)</span>
        </label>
        <ol id="merge-list" class="file-list" hidden></ol>
        <div class="form-row">
          <button type="button" id="merge-run" class="btn" disabled>Merge and download</button>
          <span id="merge-status" class="status" role="status"></span>
        </div>
      </section>
