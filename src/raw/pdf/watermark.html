<section id="tool-watermark" data-tool-panel hidden>
        <label class="file-drop" for="watermark-file">
          <input type="file" id="watermark-file" accept="application/pdf" />
          <span>Choose one PDF to watermark</span>
        </label>
        <p class="size-note" id="watermark-info"></p>

        <fieldset class="options">
          <legend>Markup</legend>
          <div class="option">
            <label class="radio" for="watermark-text">Text</label>
            <input
              type="text"
              id="watermark-text"
              class="text-input range-input"
              spellcheck="false"
              placeholder="Confidential"
            />
          </div>
          <div class="option">
            <label class="range-row">
              <span>Font size</span>
              <input type="range" id="watermark-size" min="8" max="120" value="40" />
              <output for="watermark-size">40</output>
            </label>
          </div>
          <div class="option">
            <label class="range-row">
              <span>Opacity</span>
              <input type="range" id="watermark-opacity" min="5" max="100" value="15" />
              <output for="watermark-opacity">15</output>
            </label>
          </div>
          <div class="option">
            <label class="range-row">
              <span>Rotation</span>
              <input type="range" id="watermark-rotate" min="-90" max="90" value="-45" />
              <output for="watermark-rotate">-45</output>
            </label>
          </div>
          <div class="option">
            <label class="radio" for="watermark-color">Color</label>
            <select id="watermark-color" class="select">
              <option value="black" selected>Black</option>
              <option value="white">White</option>
              <option value="red">Red</option>
            </select>
          </div>
        </fieldset>

        <div class="form-row">
          <button type="button" id="watermark-run" class="btn" disabled>Add watermark and download</button>
          <span id="watermark-status" class="status" role="status"></span>
        </div>
      </section>
